substitutions:
  _REGION: us-central1
  _REPO_NAME: all-projects
  _SERVICE_NAME: all-projects-hub
  _GEMINI_SECRET: google-api-key
  _MEMORY: 4Gi
  _CPU: "2"
  _MAX_INSTANCES: "1"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --cpu-boost
      - --timeout=300
      - --concurrency=80
      - --max-instances=${_MAX_INSTANCES}
      - --allow-unauthenticated
      - --set-secrets=GEMINI_API_KEY=${_GEMINI_SECRET}:latest,GOOGLE_API_KEY=${_GEMINI_SECRET}:latest,AOD_GEMINI_API_KEY=${_GEMINI_SECRET}:latest
      - --set-env-vars=UNIFIED_DATA_DIR=/app/data,AGENT_ASSURENCE_ENVIRONMENT=production,AGENT_ASSURENCE_AUTH_DISABLED=false,AGENT_ASSURANCE_DEV_ALLOW_PRIVATE_HOSTS=true,AOD_AUTH_MODE=demo,CONSTRUCTION_APP_ENV=local,ALLOW_DEMO_LOGIN=true

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest
