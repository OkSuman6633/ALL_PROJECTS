server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_buffering off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","services":6}';
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","services":6}';
    }

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 1. Agent Assurance Laboratory (FastAPI + static frontend)
    location = /Agent_Assurence {
        return 302 /Agent_Assurence/;
    }
    location /Agent_Assurence/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. AI Operations Diagnostic (Next.js + FastAPI)
    location = /AI-operations-Diagonostic/api {
        return 301 /AI-operations-Diagonostic/api/;
    }
    location /AI-operations-Diagonostic/api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
