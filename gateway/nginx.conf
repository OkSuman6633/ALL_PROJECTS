server {
    listen 80;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /Agent_Assurence/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /AI-operations-Diagonostic/ {
        proxy_pass http://127.0.0.1:3001/AI-operations-Diagonostic/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /Construction-variation-tracker/ {
        proxy_pass http://127.0.0.1:5173/Construction-variation-tracker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /Contract-Invoice-Leakage-Finder/ {
        proxy_pass http://127.0.0.1:5174/Contract-Invoice-Leakage-Finder/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /Industry-Specific-Lead-to-Order-Agent/ {
        proxy_pass http://127.0.0.1:5175/Industry-Specific-Lead-to-Order-Agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /Procurement-Quote-Comparison-Agent/ {
        proxy_pass http://127.0.0.1:3002/Procurement-Quote-Comparison-Agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
