services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: ./api/.env
        required: false
      - path: ./.env
        required: false
    environment:
      AOD_ENVIRONMENT: local
      AOD_DATA_DIR: /app/data
      AOD_AUTH_MODE: demo
      AOD_DEMO_TOKEN: ${AOD_DEMO_TOKEN:-local-demo-token-change-me}
    volumes:
      - ./api/app:/app/app
      - aod_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 3s
      retries: 3
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_TOKEN: ${AOD_DEMO_TOKEN:-local-demo-token-change-me}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  aod_data:
