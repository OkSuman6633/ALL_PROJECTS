  "components": {
    "schemas": {
      "ActivityInput": {
        "properties": {
          "label": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Label"
          },
          "monthly_volume": {
            "type": "number",
            "minimum": 0.0,
            "title": "Monthly Volume"
          },
          "minutes_per_unit": {
            "type": "number",
            "minimum": 0.0,
            "title": "Minutes Per Unit"
          },
          "hourly_rate": {
            "type": "number",
            "minimum": 0.0,
            "title": "Hourly Rate",
            "default": 0
          },
          "currency": {
            "type": "string",
            "maxLength": 3,
            "minLength": 3,
            "title": "Currency",
            "default": "GBP"
          },
          "achievable_reduction_pct": {
            "type": "number",
            "maximum": 100.0,
            "minimum": 0.0,
            "title": "Achievable Reduction Pct",
            "default": 20
          },
          "source_ids": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Source Ids",
            "default": []
          },
          "confirmed": {
            "type": "boolean",
            "title": "Confirmed",
            "default": false
          }
        },
        "type": "object",
        "required": [
          "label",
          "monthly_volume",
          "minutes_per_unit"
        ],
        "title": "ActivityInput"
      },
      "ApproveRequest": {
        "properties": {
          "expected_revision": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Expected Revision"
          },
          "accepted_assumptions": {
            "additionalProperties": true,
            "type": "object",
            "title": "Accepted Assumptions",
            "default": {}
          }
        },
        "type": "object",
        "required": [
          "expected_revision"
        ],
        "title": "ApproveRequest"
      },
      "AssessmentCreate": {
        "properties": {
          "template_id": {
            "type": "string",
            "title": "Template Id",
            "default": "standard-process-v1"
          },
          "process_name": {
            "type": "string",
            "maxLength": 160,
            "minLength": 2,
            "title": "Process Name"
          },
          "sector": {
            "type": "string",
            "maxLength": 100,
            "title": "Sector",
            "default": "Unspecified"
          },
          "period": {
            "type": "string",
            "maxLength": 100,
            "title": "Period",
            "default": "Last 30 days"
          },
          "unit": {
            "type": "string",
            "maxLength": 60,
            "title": "Unit",
            "default": "cases"
          },
          "goals": {
            "type": "string",
            "maxLength": 1000,
            "title": "Goals",
            "default": ""
          },
          "activity_inputs": {
            "items": {
              "$ref": "#/components/schemas/ActivityInput"
            },
            "type": "array",
            "minItems": 1,
            "title": "Activity Inputs"
          }
        },
        "type": "object",
        "required": [
          "process_name"
        ],
        "title": "AssessmentCreate"
      },
      "Body_upload_evidence_v1_assessments__assessment_id__uploads_post": {
        "properties": {
          "file": {
            "type": "string",
            "format": "binary",
            "title": "File"
          }
        },
        "type": "object",
        "required": [
          "file"
        ],
        "title": "Body_upload_evidence_v1_assessments__assessment_id__uploads_post"
      },
      "FactChange": {
        "properties": {
          "activity_id": {
            "type": "string",
            "title": "Activity Id"
          },
          "label": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Label"
          },
          "monthly_volume": {
            "anyOf": [
              {
                "type": "number",
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Monthly Volume"
          },
          "minutes_per_unit": {
            "anyOf": [
              {
                "type": "number",
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Minutes Per Unit"
          },
          "hourly_rate": {
            "anyOf": [
              {
                "type": "number",
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Hourly Rate"
          },
          "achievable_reduction_pct": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 100.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Achievable Reduction Pct"
          },
          "confirmed": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "null"
              }
            ],
            "title": "Confirmed"
          }
        },
        "type": "object",
        "required": [
          "activity_id"
        ],
        "title": "FactChange"
      },
      "FactPatch": {
        "properties": {
          "expected_revision": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Expected Revision"
          },
          "changes": {
            "items": {
              "$ref": "#/components/schemas/FactChange"
            },
            "type": "array",
            "minItems": 1,
            "title": "Changes"
          }
        },
        "type": "object",
        "required": [
          "expected_revision",
          "changes"
        ],
        "title": "FactPatch"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "SubmitRequest": {
        "properties": {
          "expected_revision": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Expected Revision"
          }
        },
        "type": "object",
        "required": [
          "expected_revision"
        ],
        "title": "SubmitRequest"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
